{% extends "base.html" %}

{% block title %}Baixar conta{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>Baixar conta</h1>
    <p>{{ conta.descricao }} - R$ {{ conta.valor|floatformat:2 }}</p>
  </div>
  <a class="secondary-button" href="{% url 'financeiro:contas' %}">Voltar</a>
</header>

<form method="post" class="form-grid panel">
  {% csrf_token %}
  {% include "includes/form.html" %}
  <div class="form-actions">
    <a class="secondary-button" href="{% url 'financeiro:contas' %}">Cancelar</a>
    <button class="primary-button" type="submit">Confirmar baixa</button>
  </div>
</form>
{% endblock %}
