{% extends "base.html" %}

{% block title %}Promocao{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>{% if object %}Editar promocao{% else %}Nova promocao{% endif %}</h1>
    <p>Defina periodo e preco promocional usado automaticamente no PDV.</p>
  </div>
</header>

<form method="post" class="form-grid panel">
  {% include "includes/form.html" %}
  <div class="form-actions">
    <a class="secondary-button" href="{% url 'promocoes:lista' %}">Cancelar</a>
    <button class="primary-button" type="submit">Salvar</button>
  </div>
</form>
{% endblock %}
