<form method="get" class="toolbar report-filter">
  <label>
    <span>Início</span>
    <input type="date" name="data_inicio" value="{{ data_inicio|date:'Y-m-d' }}">
  </label>
  <label>
    <span>Fim</span>
    <input type="date" name="data_fim" value="{{ data_fim|date:'Y-m-d' }}">
  </label>
  <label>
    <span>Filial</span>
    <select name="filial">
      {% if permite_consolidado %}<option value="">Todas as filiais</option>{% endif %}
      {% for filial in filiais %}
        <option value="{{ filial.pk }}" {% if filial_id == filial.pk|stringformat:"s" %}selected{% endif %}>{{ filial }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Filtrar</button>
</form>
