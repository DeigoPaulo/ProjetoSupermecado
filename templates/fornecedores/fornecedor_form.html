{% extends "base.html" %}

{% block title %}Fornecedor{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>{% if object %}Editar fornecedor{% else %}Novo fornecedor{% endif %}</h1>
    <p>Dados comerciais usados em compras e recebimento de produtos.</p>
  </div>
</header>

<form method="post" class="form-grid panel">
  {% include "includes/form.html" %}
  <div class="form-actions">
    <a class="secondary-button" href="{% url 'fornecedores:lista' %}">Cancelar</a>
    <button class="primary-button" type="submit">Salvar</button>
  </div>
</form>
{% endblock %}
