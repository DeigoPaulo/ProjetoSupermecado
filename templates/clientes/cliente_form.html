{% extends "base.html" %}

{% block title %}Cliente{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>{% if object %}Editar cliente{% else %}Novo cliente{% endif %}</h1>
    <p>Dados basicos para identificar vendas e contatos.</p>
  </div>
</header>

<form method="post" class="form-grid panel">
  {% include "includes/form.html" %}
  <div class="form-actions">
    <a class="secondary-button" href="{% url 'clientes:lista' %}">Cancelar</a>
    <button class="primary-button" type="submit">Salvar</button>
  </div>
</form>
{% endblock %}
